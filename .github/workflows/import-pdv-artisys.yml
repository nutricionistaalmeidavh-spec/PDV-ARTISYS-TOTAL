name: Import PDV Artisys source snapshot

on:
  push:
    branches:
      - feature/bootstrap-pdv-artisys-total
    paths:
      - .github/workflows/import-pdv-artisys.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-pdv-artisys-total
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'nutricionistaalmeidavh-spec/PDV-ARTISYS-TOTAL'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout destination branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Download exact upstream commit (without its Git history)
        shell: bash
        run: |
          set -euo pipefail
          git init -q .import-source
          git -C .import-source remote add origin https://github.com/nutricionistaalmeidavh-spec/PDV-ARTISYS.git
          git -C .import-source fetch --depth=1 origin 7efea9c61f75be1536a1e516e917218f2b8bf2bf
          git -C .import-source checkout --quiet --detach FETCH_HEAD
          test "$(git -C .import-source rev-parse HEAD)" = "7efea9c61f75be1536a1e516e917218f2b8bf2bf"
          mkdir -p legacy/pdv-artisys
          rsync -a --delete --exclude=.git .import-source/ legacy/pdv-artisys/

      - name: Verify all tracked source files and content hashes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import hashlib

          source = Path('.import-source')
          dest = Path('legacy/pdv-artisys')
          tracked = subprocess.check_output([
              'git', '-C', str(source), 'ls-files', '-z'
          ]).decode('utf-8').rstrip('\0').split('\0')
          source_paths = {Path(path).as_posix() for path in tracked}
          dest_paths = {p.relative_to(dest).as_posix() for p in dest.rglob('*') if p.is_file()}
          assert source_paths == dest_paths, f"Source/dest mismatch: missing={len(source_paths - dest_paths)}, extra={len(dest_paths - source_paths)}"
          for rel in sorted(source_paths):
              src_hash = hashlib.sha256((source / rel).read_bytes()).digest()
              dst_hash = hashlib.sha256((dest / rel).read_bytes()).digest()
              assert src_hash == dst_hash, f"Content mismatch: {rel}"
          assert len(tracked) >= 800, f"Unexpected truncated snapshot: {len(tracked)}"
          print(f"Snapshot verified: {len(tracked)} files, all SHA-256 matches")
          PY

      - name: Commit reference snapshot only to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- legacy/pdv-artisys
          if git diff --cached --quiet; then
            echo "Snapshot is already identical."
            exit 0
          fi
          git commit -m "chore: import pinned PDV Artisys 2.0.1 as isolated legacy snapshot"
          git push origin HEAD:feature/bootstrap-pdv-artisys-total
