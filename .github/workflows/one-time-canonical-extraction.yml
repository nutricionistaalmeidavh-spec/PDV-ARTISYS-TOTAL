name: One-time migration of PDV Total into canonical web product

on:
  push:
    branches:
      - refactor/online-product-codebase
    paths:
      - '.github/workflows/one-time-canonical-extraction.yml'

permissions:
  contents: write

concurrency:
  group: pdv-total-code-extraction
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/online-product-codebase
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move original canonical source, delete desktop-only products
        shell: bash
        run: |
          set -euo pipefail
          test -d legacy/pdv-artisys/js
          test -d legacy/pdv-artisys/desktop/renderer
          mkdir -p packages/core/vendor packages/core/test apps/web
          git mv legacy/pdv-artisys/js packages/core/js
          git mv legacy/pdv-artisys/server packages/core/server
          git mv legacy/pdv-artisys/shared packages/core/shared
          git mv legacy/pdv-artisys/vendor/erp-modules packages/core/vendor/erp-modules
          git mv legacy/pdv-artisys/vendor/artisys-finance-domain packages/core/vendor/artisys-finance-domain
          git mv legacy/pdv-artisys/desktop/renderer/* apps/web/
          for file in \
            authorization-service.test.js \
            permission-registry.test.js \
            payment-rules.test.js \
            pdv-event-types.test.js \
            domain-event-bus.test.js \
            domain-event-dispatcher.test.js \
            inventory-service.test.js \
            cash-service.test.js \
            sale-service.test.js \
            sales-last-unit-concurrency.test.js \
            sales-order-service.test.js \
            stock-transfer.test.js \
            public-ordering.test.js; do
            git mv "legacy/pdv-artisys/test/$file" "packages/core/test/$file"
          done
          git rm -r -q legacy/pdv-artisys
          sed -i 's@../../shared/order-composer.js@../../packages/core/shared/order-composer.js@g' apps/web/index.html
          # The one-off migration workflow is not part of the SaaS product.
          git rm .github/workflows/one-time-canonical-extraction.yml
          git add -A
          # Git leaves empty directories after mv/rm; Git never stores those.
          if [ -d legacy ]; then find legacy -depth -type d -empty -delete; fi
          test ! -d legacy
          test ! -d desktop
          test -f packages/core/js/domains/sales/sale-service.js
          test -f packages/core/js/domains/cash/cash-service.js
          test -f packages/core/js/domains/inventory/inventory-service.js
          test -f apps/web/index.html
          test ! -f apps/web/main.cjs
          git diff --cached --stat | tail -n 12
      - name: Verify single-source product and Cloudflare bundling
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cd apps/api && npm run check
          cd ../..
          node --check packages/core/js/domains/sales/sale-service.js
          node --check packages/core/js/domains/inventory/inventory-service.js
          node --check packages/core/js/domains/cash/cash-service.js
          node --check packages/core/js/core/auth/authorization-service.js
      - name: Run original domain regression tests in their new canonical home
        shell: bash
        run: npm run test:core
      - name: Commit migration only inside PDV TOTAL feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: convert imported desktop snapshot into single canonical web product structure'
          git push origin HEAD:refactor/online-product-codebase
