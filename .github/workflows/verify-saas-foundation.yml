name: Verify operational readiness

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'apps/api/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'scripts/verify-cloudflare-build.mjs'
      - 'packages/core/**'
      - 'apps/web/**'
      - 'apps/landing/**'
      - 'scripts/public-landing.test.mjs'
      - 'scripts/selfhost-backup.mjs'
      - 'scripts/selfhost-backup.test.mjs'
      - 'scripts/report-xlsx.test.mjs'
      - 'scripts/smoke-selfhosted.mjs'
      - 'scripts/web-browser-e2e.mjs'
      - 'scripts/*browser.mjs'
      - 'scripts/qa-journey-report.mjs'
      - 'scripts/qa-variant-contracts.mjs'
      - 'docs/QA-HOMOLOGACAO-FISICA.md'
      - 'scripts/qa-05-transaction-proofs.mjs'
      - 'scripts/web-navigation.test.mjs'
      - 'scripts/enterprise-web-routes.test.mjs'
      - 'scripts/web-settings-ui.test.mjs'
      - 'scripts/r2-deploy.mjs'
      - 'scripts/r2-lan-browser-e2e.mjs'
      - 'scripts/pricing-regression.test.mjs'
      - 'docs/ROADMAP-OPERACIONAL.md'
      - 'README.md'
      - 'docs/WEB-PERIPHERALS.md'
      - '.github/workflows/verify-saas-foundation.yml'
  workflow_dispatch:

concurrency:
  group: saas-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r2-windows-deployment:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify free Windows local server and terminal deployment profiles
        run: node --experimental-sqlite --test apps/api/test/r2-deployment-profiles.test.mjs
  identity-and-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Cloudflare repository-root deployment contract
        run: npm run build
      - name: Test operational contracts and exports
        run: npm run test:operations
      - name: Test free offline SQLite backup and restore
        run: npm run test:selfhost
      - name: Test canonical sales, inventory, cash and authorization contracts
        run: npm run test:core
      - name: Validate original renderer web syntax (no second app)
        run: npm run check:web
      - name: Verify public landing and account-entry contracts
        run: npm run check:landing
      - name: Validate entrypoints
        working-directory: apps/api
        run: npm run check
      - name: Test real SQLite isolation and canonical identity
        working-directory: apps/api
        run: npm test
      - name: Smoke real self-hosted PWA and SQLite API on one origin
        run: node scripts/smoke-selfhosted.mjs
      - name: Smoke test offline self-hosted provisioning
        working-directory: apps/api
        env:
          PDV_OWNER_EMAIL: owner@example.test
          PDV_OWNER_NAME: Local Owner
          PDV_TENANT_SLUG: smoke-store
          PDV_TENANT_NAME: Smoke Store
          PDV_OWNER_PASSWORD: DummyStrongPassOnlyForCI2026
          LOCAL_DB_PATH: .local/smoke.sqlite
        run: |
          node --experimental-sqlite src/provision.mjs --local
          node --experimental-sqlite --input-type=module -e "import {openLocalDatabase} from './src/local-db.mjs'; const d=openLocalDatabase('.local/smoke.sqlite'); const r=await d.prepare('SELECT COUNT(*) AS c FROM tenant_memberships').bind().first(); if(r.c!==1)process.exit(1); d.close();"
      - name: Cloudflare Worker dry run from root (never deploy)
        run: npx --yes wrangler@4.137.0 deploy --dry-run --outdir dist-check
      - name: Test isolated D1 schema in Wrangler local emulator
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0001_identity.sql
      - name: Test commerce D1 schema and immutable stock ledger in Wrangler
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0002_commerce.sql
      - name: Test cash/finance migration in real local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0003_cash_finance.sql
      - name: Test advanced finance migration in real local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0004_advanced_finance.sql
      - name: Test vertical parity D1 migration in real local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0005_vertical_parity.sql
      - name: Test additive desktop parity migration in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0006_desktop_parity.sql
      - name: Test canonical stock transfer migration in real local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0007_stock_transfers.sql
      - name: Test P1 atomic compensations and locked cashier history in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0008_transaction_reversals.sql
      - name: Test P2 deep catalog, kit allocation, purchase cost and reservation migration in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0009_catalog_inventory.sql
      - name: Test P2 purchase order and partial receiving migration in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0010_purchase_orders.sql
      - name: Test P2 private product images schema in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0011_product_media.sql
      - name: Test canonical P3 sale item note migration in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0012_sale_item_notes.sql
      - name: Test P3 independent cash terminal schema in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0013_cash_terminals.sql
      - name: Test P3 server-priced configured checkout schema in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0014_checkout_configurations.sql
      - name: Test P4 monthly seller targets schema in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0015_seller_sales_targets.sql
      - name: Test additive immutable lot receipt provenance migration in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0016_inventory_lot_receipts.sql
      - name: Test P5 per-branch stock minimum policy in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0017_inventory_minimum_levels.sql
      - name: Test P2 immutable lot balance and FEFO allocation schema in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0018_inventory_lot_balances.sql
      - name: Test P1 storage addresses migration in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0019_inventory_storage_locations.sql
      - name: Test P2 safe configured sale line schema in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0020_sale_configured_lines.sql
      - name: Test R4 restaurant operations migration in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0021_r4_restaurant_operations.sql
      - name: Test R4 canonical restaurant settlement schema in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0022_r4_restaurant_checkout.sql
      - name: Test R4 extended verticals migration in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0023_r4_extended_verticals.sql
      - name: Test R4 print outbox migration in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0024_r4_print_outbox.sql
      - name: Test R2 LAN pairing, revocation and tenant device schema in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0025_r2_lan_devices.sql
      - name: Test R4 frozen KDS item snapshots migration in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0026_r4_kds_ticket_snapshots.sql
      - name: Test canonical immutable R3 receipt branding migration in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0027_r3_receipt_branding.sql
      - name: Verify R4 web workflows migration with local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0028_r4_web_order_workflows.sql
      - name: Verify R4 concurrent transfer guard in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0029_r4_saas_concurrency.sql
      - name: Test public signup throttle schema in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0030_public_registration.sql
      - name: Test SaaS tenant security and subscription schema in local D1
        run: npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0031_saas_access.sql
      - name: Test billing checkout and P2 security tables in local D1
        run: |
          npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0032_artisys_billing.sql
          npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0033_p2_account_security.sql
          npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0034_platform_ui_sessions.sql
          npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0035_password_resets.sql
          npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0036_central_platform_bridge.sql
          npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0037_recipe_details.sql
          npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0038_product_menu_usage.sql
          npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0039_p4_finance_operations.sql
          npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0040_wallet_operations.sql
          npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0041_central_owner_licenses.sql
          npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0042_finance_query_indexes.sql
          npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/migrations/0043_print_relay.sql
      - name: Cache Chromium used by browser regression gates
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install one Chromium for all browser regression gates
        run: |
          npm install --no-save --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.63.0
          npx playwright install chromium
          # Hosted runners usually have Chromium's system libraries already.
          # Avoid an unconditional apt update against unrelated package feeds.
          if ! node --input-type=module -e "import {chromium} from 'playwright'; const browser=await chromium.launch({headless:true}); await browser.close();"; then
            npx playwright install-deps chromium
            node --input-type=module -e "import {chromium} from 'playwright'; const browser=await chromium.launch({headless:true}); await browser.close();"
          fi
      - name: Smoke real Cloudflare Workerd with local D1 and 100k PBKDF2
        env:
          RUN_BROWSER_SMOKE: 'true'
          PDV_OWNER_EMAIL: owner@example.test
          PDV_OWNER_NAME: Local Owner
          PDV_TENANT_SLUG: workerd-test
          PDV_TENANT_NAME: Workerd Test
          PDV_OWNER_PASSWORD: DummyStrongPassOnlyForCI2026
        run: |
          node --experimental-sqlite apps/api/src/provision.mjs
          npx --yes wrangler@4.137.0 d1 execute pdv-artisys-total --local --file apps/api/.local/provision.seed.sql
          node scripts/smoke-workerd.mjs
      - name: Regression of audited product flows against isolated SQLite and Chromium
        run: npm run test:ux && npm run test:ux:browser
      - name: E2E original PDV renderer in Chromium (desktop + mobile)
        run: node scripts/web-browser-e2e.mjs
      - name: R2 self-hosted HTTPS LAN mobile pairing, revocation, offline/reconnection E2E
        run: node --experimental-sqlite scripts/r2-lan-browser-e2e.mjs
      - name: QA role matrix — seven real browser profiles, denied writes, SQLite and offline recovery
        run: node --experimental-sqlite scripts/qa-role-matrix-browser.mjs
      - name: QA-05 targeted transaction integrity (transfer, split, prepayment, retries)
        run: node --experimental-sqlite scripts/qa-05-transaction-proofs.mjs
      - name: Validate positive, denied and retry contracts for every QA-00 to QA-12 journey
        run: node --experimental-sqlite scripts/qa-variant-contracts.mjs
      - name: Write QA-00 through QA-12 coverage manifest and Actions summary
        if: always()
        run: node scripts/qa-journey-report.mjs
      - name: Save browser visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdv-total-browser-qa
          path: qa-artifacts/
          if-no-files-found: ignore
      - name: Verify a single maintained product, with no legacy desktop copy
        shell: bash
        run: |
          set -euo pipefail
          test ! -d legacy
          test ! -d desktop
          test -f packages/core/js/core/auth/default-profiles.js
          test -f packages/core/js/domains/sales/sale-service.js
          test -f packages/core/js/domains/cash/cash-service.js
          test -f packages/core/js/domains/inventory/inventory-service.js
          test -f apps/web/index.html
          test ! -f apps/api/src/renderer.js
          ! grep -R "legacy/pdv-artisys" apps/api/src scripts/verify-cloudflare-build.mjs

  mobile-webkit-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the same PWA assets locally without publishing
        run: npm run build
      - name: Install open-source WebKit test browser
        run: |
          npm install --no-save --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.63.0
          npx playwright install webkit
          if ! node --input-type=module -e "import {webkit} from 'playwright'; const browser=await webkit.launch({headless:true}); await browser.close();"; then
            npx playwright install-deps webkit
            node --input-type=module -e "import {webkit} from 'playwright'; const browser=await webkit.launch({headless:true}); await browser.close();"
          fi
      - name: WebKit mobile 390px login authorization revocation offline recovery for seven roles
        env:
          PDV_TEST_BROWSER: webkit
        run: node --experimental-sqlite scripts/qa-role-matrix-browser.mjs
      - name: Upload WebKit mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdv-total-webkit-qa
          path: qa-artifacts/journeys-webkit/
          if-no-files-found: ignore
