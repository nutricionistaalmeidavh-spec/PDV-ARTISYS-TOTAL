    <aside id="app-sidebar" class="sidebar" aria-label="Navegação principal">
      <button class="brand-mark nav-button" data-route="home" title="ArtiSys PDV" aria-label="Ir para início"><span>A</span></button>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-spacer"></div>
      <button class="nav-button" data-route="settings" title="Configurações" aria-label="Configurações" hidden><span class="nav-button-icon" data-icon="settings"></span><span class="nav-label">Config.</span></button>

          <div id="network-status" class="status-pill"><i></i><span>Rede Local</span></div>
          <div class="context-pill"><span data-icon="store"></span><strong id="store-name">Loja Matriz</strong></div>
          <div class="context-pill"><span data-icon="terminal"></span><strong id="terminal-name">Terminal PDV-01</strong></div>
          <button id="operator-button" class="context-pill operator-pill" type="button"><span data-icon="user"></span><strong id="operator-name">Sem operador</strong><small id="operator-role"></small></button>
          <div id="clock" class="clock"></div>
        </div>
        <div class="window-controls" aria-label="Controles da janela">
          <button type="button" data-window="minimize" aria-label="Minimizar">−</button>
          <button type="button" data-window="maximize" aria-label="Maximizar">□</button>
          <button type="button" data-window="close" aria-label="Fechar">×</button>
        </div>
      </header>
      <main id="route-content" class="route-content" tabindex="-1"></main>
      <footer class="app-footer">
        <div><strong>ARTISYS</strong><span>Tecnologia para o seu negócio.</span></div>
        <div><span id="footer-status" class="footer-status"><i></i>Sistema local</span><span id="app-version">Versão 0.0.0</span><span>Suporte ArtiSys</span></div>
      </footer>
    </section>
