services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3.18.1
    container_name: artisys-woodpecker-server
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - woodpecker-server-data:/var/lib/woodpecker/
    environment:
      WOODPECKER_HOST: ${WOODPECKER_HOST}
      WOODPECKER_OPEN: "false"
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN}
      WOODPECKER_REPO_OWNERS: ${WOODPECKER_REPO_OWNERS}
      WOODPECKER_GITHUB: "true"
      WOODPECKER_GITHUB_CLIENT: ${WOODPECKER_GITHUB_CLIENT}
      WOODPECKER_GITHUB_SECRET: ${WOODPECKER_GITHUB_SECRET}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_EXPERT_WEBHOOK_HOST: ${WOODPECKER_EXPERT_WEBHOOK_HOST}

volumes:
  woodpecker-server-data:
    name: artisys-woodpecker-server-data
